<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b5e20"/>
      <stop offset="100%" stop-color="#0a2e0e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#76ff03"/>
      <stop offset="100%" stop-color="#00e676"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Target reticle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#accent)" stroke-width="8" stroke-opacity="0.4" stroke-dasharray="16 8"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="url(#accent)" stroke-width="4" stroke-opacity="0.6"/>
  <!-- Wheat / Plant stalk -->
  <path d="M256,390 C256,220 256,120 256,90" fill="none" stroke="url(#accent)" stroke-width="12" stroke-linecap="round"/>
  <!-- Leaves left -->
  <path d="M256,320 C210,320 170,290 170,250 C210,250 250,280 256,320 Z" fill="#66bb6a"/>
  <path d="M256,240 C220,240 190,210 190,180 C220,180 250,210 256,240 Z" fill="#81c784"/>
  <path d="M256,170 C230,170 210,140 210,120 C230,120 250,150 256,170 Z" fill="#a5d6a7"/>
  <!-- Leaves right -->
  <path d="M256,280 C302,280 342,250 342,210 C302,210 262,240 256,280 Z" fill="#4caf50"/>
  <path d="M256,200 C292,200 322,170 322,140 C292,140 262,170 256,200 Z" fill="#66bb6a"/>
  <!-- Tech crosshairs -->
  <line x1="256" y1="50" x2="256" y2="80" stroke="#76ff03" stroke-width="8" stroke-linecap="round"/>
  <line x1="256" y1="432" x2="256" y2="462" stroke="#76ff03" stroke-width="8" stroke-linecap="round"/>
  <line x1="50" y1="256" x2="80" y2="256" stroke="#76ff03" stroke-width="8" stroke-linecap="round"/>
  <line x1="432" y1="256" x2="462" y2="256" stroke="#76ff03" stroke-width="8" stroke-linecap="round"/>
</svg>
