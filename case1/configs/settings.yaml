# Системные настройки конвейера Кейса №1 (Main)

project:
  name: "qostanai-case1-weed-monitoring"
  version: "1.0.0"
  case_type: "main"

paths:
  dataset_root: "Dataset 1 кейс"
  weeds_dir: "Dataset 1 кейс/Сорняки"
  field_photos_dir: "Dataset 1 кейс/ФотоПолей"
  detector_model: "weedblaster-vision-yolov8s/best.pt"
  output_dir: "case1/output"
  crops_cache_dir: "case1/output/crops"
  logs_dir: "case1/output/logs"

tiling:
  tile_size: 1280
  overlap_ratio: 0.20
  iou_threshold: 0.45

detector:
  imgsz: 1280
  conf_threshold: 0.25
  device: "cpu" # "mps" для Apple Silicon или "cuda" при наличии

server:
  host: "127.0.0.1"
  port: 8000
  api_prefix: "/api/v1"
  fallback_offline_mode: true

review:
  # Единый порог уверенности вида сорняка (26-классовый классификатор).
  # Всё ниже этого значения -> статус unknown / manual_review -> уходит агроному.
  # Читается через case1.configs.loader.get_species_confidence_threshold(); не
  # дублировать это значение как отдельную константу в других модулях.
  species_confidence_threshold: 0.75
